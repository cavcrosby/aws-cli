---
name: Build the container images

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version of the AWS CLI (e.g. 2.33.12)
        required: true
      latest:
        type: boolean
        description: Is the latest version?
        required: true
        default: false

jobs:
  docker-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download the AWS CLI zip file
        run: >
          curl \
            --output "./awscli-exe-linux-x86_64.zip" \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${{ inputs.version }}.zip"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: cavcrosby
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push to Docker Hub (latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: cavcrosby/aws-cli:latest,cavcrosby/aws-cli:${{ inputs.version }}
        if: ${{ inputs.latest }}

      - name: Build and push to Docker Hub (non-latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: cavcrosby/aws-cli:${{ inputs.version }}
        if: ${{ !inputs.latest }}
